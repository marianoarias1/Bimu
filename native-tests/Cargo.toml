[package]
name="bimu-native-core-tests"
version="0.1.0"
edition="2021"
publish=false
[dependencies]
serde={version="1",features=["derive"]}
serde_json="1"
semver="1"
chrono="0.4"
chrono-tz="0.10"
spake2="0.4"
snow="0.10"
hmac="0.13"
sha2="=0.10.9"
sha2-hmac = { package = "sha2", version = "0.11" }
base64="0.23"

[target.'cfg(windows)'.dependencies]
winreg="0.56"

[dev-dependencies]
# Previous production primitives, only for cross-version protocol regression tests.
hmac-legacy = { package = "hmac", version = "=0.12.1" }
