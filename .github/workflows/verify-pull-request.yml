name: Verify pull request
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.classify.outputs.app }}
    steps:
      - name: Classify pull request files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' > changed-files.txt
          test -s changed-files.txt
          app=false
          while IFS= read -r file; do
            case "$file" in
              docs/*|README.md|ROADMAP.md|.github/workflows/verify-pull-request.yml|.github/workflows/windows-release.yml|.github/workflows/website.yml) ;;
              *) app=true ;;
            esac
          done < changed-files.txt
          echo "app=$app" >> "$GITHUB_OUTPUT"
  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: node --test tests/browser-test-update.test.mjs
      - name: Ensure the release version is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          $testOnly = node scripts/browser-test-update.mjs $env:PR_BASE
          if ($LASTEXITCODE -ne 0) { throw 'Could not classify the dependency changes.' }
          if ($testOnly -ceq 'true') { Write-Host 'Verification-only changes: build the test installer without a new release version.'; exit 0 }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tags = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing releases.' }
          if ($tags -contains "v$version") { throw "Version v$version is already published. Increment the version before merging." }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri -> target
            native-tests -> target
      - run: npm ci
      - run: npm test
      - name: Verify notch reveal frames in Microsoft Edge
        run: |
          npm run test:browser
          node tests/pill-and-devices.browser.mjs
      - name: Preserve reveal screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Bimu-notch-reveal-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
      - run: cargo test --locked --manifest-path native-tests/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run build
      - run: npm run desktop:build -- --bundles nsis
      - name: Verify Windows executable publisher
        shell: pwsh
        run: |
          $exe = Get-Item src-tauri/target/release/Bimu.exe -ErrorAction Stop
          if ($exe.VersionInfo.CompanyName -cne 'Bimu') { throw "Unexpected executable publisher: $($exe.VersionInfo.CompanyName)" }
      - run: git diff --exit-code -- src-tauri/Cargo.lock native-tests/Cargo.lock
      - name: Preserve verification installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Bimu-verificacion-no-publicar
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
  verify:
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required verification
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APP_CHANGED: ${{ needs.changes.outputs.app }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$APP_CHANGED" = true ]; then
            test "$BUILD_RESULT" = success
          else
            test "$APP_CHANGED" = false
            echo 'Website/documentation only: no Windows installer or app version bump required.'
          fi
