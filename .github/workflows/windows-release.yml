name: Windows installer
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'ROADMAP.md'
      - '.github/workflows/website.yml'
      - '.github/workflows/verify-pull-request.yml'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          workspaces: |
            src-tauri -> target
            native-tests -> target
      - run: npm ci
      - run: npm test
      - name: Native core tests
        run: cargo test --locked --manifest-path native-tests/Cargo.toml
      - run: npm run build
      - name: Compile and test desktop backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        run: npm run desktop:build -- --bundles nsis
      - name: Verify dependency locks unchanged
        run: git diff --exit-code -- src-tauri/Cargo.lock native-tests/Cargo.lock
      - name: Verify Bimu executable identity
        shell: pwsh
        run: |
          $exe = Get-Item src-tauri/target/release/Bimu.exe -ErrorAction Stop
          if ($exe.VersionInfo.FileDescription -notmatch 'Bimu') { throw "Unexpected executable description: $($exe.VersionInfo.FileDescription)" }
      - name: Stage installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found' }
          New-Item -ItemType Directory -Force release-out | Out-Null
          $target = "release-out/Bimu_${version}_x64-setup.exe"
          Copy-Item $installer.FullName $target
          (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content "$target.sha256"
          "BIMU_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Bimu-Windows-installer
          path: release-out/*
      - name: Publish version once
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headCommit = gh api repos/$env:GITHUB_REPOSITORY/git/ref/heads/main --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify branch head' }
          if ($headCommit.Trim() -ne $env:GITHUB_SHA) { Write-Host 'A newer commit is being built; skipping this obsolete release.'; exit 0 }
          $tag = "v$env:BIMU_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'This version is already published. Increment app, Cargo and npm versions to publish a new update.'
          }
          $assets = @(Get-ChildItem release-out -File | ForEach-Object { $_.FullName })
          gh release create $tag @assets --target $env:GITHUB_SHA --title "Bimu $env:BIMU_VERSION" --notes 'Windows x64 installer. Download and run the setup executable once. Future versions can be checked and downloaded from Settings inside Bimu. This installer is not Authenticode-signed.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
