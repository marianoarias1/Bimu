[package]
name = "mascota-companero"
version = "0.54.2"
description = "Bimu"
authors = ["Mariano"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

tokio = { version = "1", features = ["macros", "sync", "rt", "time"] }

tauri-plugin-dialog = "2"

tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
sha2 = "0.10"
spake2 = "0.4"
snow = "0.10"
hmac = "0.12"
rand = "0.8"
semver = "1"
chrono = "0.4"
chrono-tz = "0.10"
base64 = "0.22"
arboard = { version = "3.6", features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
winreg = "0.55"
windows = { version = "0.57", features = ["ApplicationModel", "Foundation", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints"] }

windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem"] }
